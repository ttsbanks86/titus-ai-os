<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 1080px; height: 1920px; }
  .container { position: relative; width: 1080px; height: 1920px; }
  .scene-image { width: 100%; height: 100%; object-fit: cover; }
  .overlay {
    position: absolute; bottom: 200px; left: 0; right: 0;
    text-align: center; color: white; font-family: 'Arial', sans-serif;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8); padding: 0 40px;
  }
  .overlay h1 { font-size: 64px; margin-bottom: 20px; line-height: 1.2; }
  .overlay p { font-size: 36px; opacity: 0.9; line-height: 1.4; }
@keyframes scene_0 {
    0% { opacity: 0; }
    0%, 33% { opacity: 1; }
}
@keyframes scene_1 {
    33%, 66% { opacity: 1; }
}
@keyframes scene_2 {
    66%, 100% { opacity: 1; }
}
[data-scene="0"] {
    animation: scene_0 9s ease-in-out infinite;
}
[data-scene="1"] {
    animation: scene_1 9s ease-in-out infinite;
}
[data-scene="2"] {
    animation: scene_2 9s ease-in-out infinite;
}
</style>
</head>
<body>
  <div class="container">
    <img src="scene_1.png" class="scene-image" style="opacity:0;position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;" data-scene="0" /><img src="scene_2.png" class="scene-image" style="opacity:0;position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;" data-scene="1" /><img src="scene_3.png" class="scene-image" style="opacity:0;position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;" data-scene="2" />
    <div class="overlay">
      <h1>AI Agents are Transforming Business</h1>
      <p>AI Agents are Transforming Business is transforming how we work and live. Teams everywhere are adopting it. The future is already here.</p>
    </div>
  </div>
  <script>
    // Seek hook for HyperFrames
    window.__hfSeek = function(t) {
      const total = 9;
      const pct = (t % total) / total;
      const scenes = document.querySelectorAll('.scene-image');
      scenes.forEach((img, i) => {
        const s = i / scenes.length;
        const e = (i + 1) / scenes.length;
        img.style.opacity = (pct >= s && pct < e) ? '1' : '0';
      });
    };
  </script>
</body>
</html>
