name: Tests

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: python -m pip install --upgrade pip && pip install pytest
    - name: Minimal smoke test
      working-directory: Titus-Vault
      shell: bash
      run: |
        echo "## CI Debug Output" >> $GITHUB_STEP_SUMMARY
        echo "PWD: $(pwd)" >> $GITHUB_STEP_SUMMARY
        echo "Python: $(python --version 2>&1)" >> $GITHUB_STEP_SUMMARY
        echo "Files:" >> $GITHUB_STEP_SUMMARY
        ls -la >> $GITHUB_STEP_SUMMARY
        echo "Test dir:" >> $GITHUB_STEP_SUMMARY
        ls -la tests/ >> $GITHUB_STEP_SUMMARY
        python -c "print('Python works!')" >> $GITHUB_STEP_SUMMARY
        python -m pytest --co tests/ 2>&1 >> $GITHUB_STEP_SUMMARY || true
        echo "Attempting tests..." >> $GITHUB_STEP_SUMMARY
        python -m pytest tests/ -v --tb=long 2>&1 >> $GITHUB_STEP_SUMMARY || echo "Tests failed with exit code $?" >> $GITHUB_STEP_SUMMARY
