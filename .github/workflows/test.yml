name: Tests

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: python -m pip install --upgrade pip && pip install pytest
    - name: Run tests
      working-directory: Titus-Vault
      shell: bash
      run: |
        python -m pytest tests/ -v --tb=long 2>&1 | tee /tmp/test-output.txt
        echo "PYTEST_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV
    - name: Write summary
      if: always()
      working-directory: Titus-Vault
      shell: bash
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat /tmp/test-output.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-output
        path: /tmp/test-output.txt
        retention-days: 5
    - name: Fail if tests failed
      if: env.PYTEST_EXIT != '0'
      run: |
        echo "Pytest exited with code $PYTEST_EXIT"
        exit 1
