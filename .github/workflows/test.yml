name: Tests

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: python -m pip install --upgrade pip && pip install pytest
    - name: Run tests and capture output
      id: tests
      working-directory: Titus-Vault
      shell: bash
      run: |
        set +e
        OUTPUT=$(python -m pytest tests/ -v --tb=long 2>&1)
        EXIT_CODE=$?
        set -e
        # Write to output
        {
          echo "output<<PYTEST_EOF"
          echo "$OUTPUT"
          echo "PYTEST_EOF"
        } >> "$GITHUB_OUTPUT"
        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Print test results
      shell: bash
      run: |
        echo "${{ steps.tests.outputs.output }}"
    - name: Fail if tests failed
      if: steps.tests.outputs.exit_code != '0'
      shell: bash
      run: |
        echo "::error::Pytest failed with exit code ${{ steps.tests.outputs.exit_code }}"
        echo "${{ steps.tests.outputs.output }}" | head -100
        exit 1
