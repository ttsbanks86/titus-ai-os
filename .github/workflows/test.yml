name: Tests

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      shell: bash
      run: python -m pip install --upgrade pip && pip install pytest
    - name: Debug environment
      shell: bash
      working-directory: Titus-Vault
      run: |
        echo "PWD=$(pwd)"
        echo "Python=$(python --version)"
        echo "Pytest version=$(python -m pytest --version)"
        echo "--- Directory listing ---"
        ls -la
        echo "--- Tests dir ---"
        ls -la tests/
        echo "--- conftest.py ---"
        cat tests/conftest.py
    - name: Run tests
      shell: bash
      working-directory: Titus-Vault
      run: python -m pytest tests/ -v --tb=long 2>&1; echo "PYTEST_EXIT=$?"
