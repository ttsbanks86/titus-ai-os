name: Tests

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: secret-scan
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
    
    - name: Debug environment
      working-directory: Titus-Vault
      run: |
        echo "Python version:"
        python --version
        echo "Current directory:"
        pwd
        echo "Directory listing:"
        ls -la
        echo "Test files:"
        ls -la tests/
        echo "08-Agents contents:"
        ls -la 08-Agents/ 2>/dev/null || echo "08-Agents/ NOT FOUND"
        echo "Required files:"
        for f in 01-Dashboard/Home.md 01-Dashboard/My-Goals.md 07-SOPs/SOPs-Index.md 08-Agents/Agents-Index.md 08-Agents/SDLC-Agent-Operating-Prompt.md pyproject.toml README.md tests/__init__.py tests/conftest.py; do
          if [ -f "$f" ]; then echo "  EXISTS: $f"; else echo "  MISSING: $f"; fi
        done
    
    - name: Run tests
      working-directory: Titus-Vault
      run: |
        pytest tests/ -v 2>&1 || { echo "PYTEST FAILED with exit $?"; exit 1; }
    
    - name: Run tests with coverage
      working-directory: Titus-Vault
      run: |
        pytest tests/ --cov=tests --cov-report=xml -v 2>&1 || { echo "COVERAGE FAILED with exit $?"; exit 1; }
        echo "coverage.xml exists:"
        ls -la coverage.xml 2>/dev/null || echo "coverage.xml NOT FOUND"
    
    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: Titus-Vault/coverage.xml
