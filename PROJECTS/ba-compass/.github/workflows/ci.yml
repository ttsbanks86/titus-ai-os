name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "PROJECTS/ba-compass/**"
  pull_request:
    branches: [main, master]
    paths:
      - "PROJECTS/ba-compass/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./PROJECTS/ba-compass

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ./PROJECTS/ba-compass/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
